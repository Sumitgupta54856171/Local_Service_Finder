version: '3.8'

services:
  # PostGIS (PostgreSQL + GIS Extensions) Container
  db:
    image: postgis/postgis:15-3.3
    container_name: lsa_postgis_db
    environment:
      POSTGRES_DB: local_service_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: 12345687
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Redis Container (Cache & Sessions ke liye)
  redis:
    image: redis:7-alpine
    container_name: lsa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data: